<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Táctico MTB</title>
    
    <!-- Librerías del Mapa (Leaflet) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { 
            background-color: #121212; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding: 15px; 
            margin: 0;
        }
        .header { font-size: 18px; color: #00CC96; margin-bottom: 20px; font-weight: bold; }
        
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .caja-dato { background-color: #1e1e1e; padding: 15px 5px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.3s; }
        .numero-gigante { font-size: 40px; font-weight: bold; margin: 0; line-height: 1.1; }
        .texto-chico { font-size: 14px; color: #aaa; margin: 5px 0 0 0; }
        
        .color-velocidad { color: #ffffff; }
        .color-pendiente { color: #FECB52; transition: 0.3s; }
        .color-distancia { color: #4DA8DA; }
        .color-tiempo { color: #FF9F1C; }

        #mapa { height: 250px; width: 100%; border-radius: 12px; margin-bottom: 20px; display: none; border: 2px solid #333; }
        
        .zona { padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; background-color: #333; margin-bottom: 20px; transition: 0.5s; }
        
        .btn-iniciar { background-color: #00CC96; color: #121212; border: none; padding: 18px 35px; font-size: 20px; border-radius: 50px; cursor: pointer; font-weight: bold; width: 100%; max-width: 300px; }
    </style>
</head>
<body>

    <div class="header">🚵‍♂️ RADAR TÁCTICO EN VIVO</div>

    <!-- PANEL DE 4 DATOS (Acá están el tiempo y los kilómetros) -->
    <div class="grid-container">
        <div class="caja-dato">
            <p class="numero-gigante color-velocidad" id="ui-velocidad">0.0</p>
            <p class="texto-chico">km/h</p>
        </div>
        <div class="caja-dato" id="caja-pendiente">
            <p class="numero-gigante color-pendiente" id="ui-pendiente">0.0</p>
            <p class="texto-chico">% Pendiente</p>
        </div>
        <div class="caja-dato">
            <p class="numero-gigante color-distancia" id="ui-distancia">0.00</p>
            <p class="texto-chico">Kilómetros</p>
        </div>
        <div class="caja-dato">
            <p class="numero-gigante color-tiempo" id="ui-tiempo">00:00</p>
            <p class="texto-chico">Tiempo</p>
        </div>
    </div>

    <div id="mapa"></div>

    <div class="zona" id="ui-estado">
        ⚪ Esperando inicio...
    </div>

    <button class="btn-iniciar" id="btn-start" onclick="iniciarRecorrido()">▶️ INICIAR RECORRIDO</button>

    <script>
        let cronometro;
        let segundosTranscurridos = 0;
        let distanciaTotal = 0; 
        let ultimaPosicion = null;
        
        // Variables para la Pendiente
        let ultimaAltitud = null;
        let distanciaParaPendiente = 0; 
        
        // Variables del Mapa
        let mapa = null;
        let marcador = null;
        let trazadoRuta = null;

        // Variables para el Entrenador de Voz
        let zonaActual = "NINGUNA"; 
        let motorVoz = window.speechSynthesis;

        // Función para que el celular hable
        function hablar(mensaje) {
            if(motorVoz.speaking) { motorVoz.cancel(); } 
            let voz = new SpeechSynthesisUtterance(mensaje);
            voz.lang = 'es-AR'; 
            motorVoz.speak(voz);
        }

        // MOTOR PRINCIPAL
        function iniciarRecorrido() {
            document.getElementById('btn-start').style.display = 'none';
            document.getElementById('ui-estado').innerText = "📡 Buscando señal GPS...";
            
            // Prueba de voz al iniciar
            hablar("Radar activado. Calculando datos de satélite.");

            // ARRANCA EL TIEMPO
            cronometro = setInterval(actualizarTiempo, 1000);

            // ARRANCA EL GPS
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(procesarGPS, errorGPS, {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 5000
                });
            } else {
                alert("Tu navegador no soporta GPS.");
            }
        }

        function actualizarTiempo() {
            segundosTranscurridos++;
            let horas = Math.floor(segundosTranscurridos / 3600);
            let minutos = Math.floor((segundosTranscurridos % 3600) / 60);
            let segundos = segundosTranscurridos % 60;
            
            let texto = (horas > 0 ? (horas < 10 ? "0"+horas+":" : horas+":") : "") + 
                        (minutos < 10 ? "0"+minutos : minutos) + ":" + 
                        (segundos < 10 ? "0"+segundos : segundos);
            document.getElementById('ui-tiempo').innerText = texto;
        }

        function procesarGPS(posicion) {
            let lat = posicion.coords.latitude;
            let lon = posicion.coords.longitude;
            let altitudActual = posicion.coords.altitude; 
            let velocidad_ms = posicion.coords.speed;

            // 1. VELOCIDAD
            if (velocidad_ms !== null && velocidad_ms > 0) {
                document.getElementById('ui-velocidad').innerText = (velocidad_ms * 3.6).toFixed(1);
            } else {
                document.getElementById('ui-velocidad').innerText = "0.0";
            }

            // 2. KILÓMETROS Y PENDIENTE
            if (ultimaPosicion !== null) {
                let distKm = calcularDistancia(
                    ultimaPosicion.coords.latitude, ultimaPosicion.coords.longitude,
                    lat, lon
                );
                // Suma la distancia al cuenta kilómetros
                distanciaTotal += distKm;
                document.getElementById('ui-distancia').innerText = distanciaTotal.toFixed(2);

                // Calcula la inclinación
                if (altitudActual !== null && ultimaAltitud !== null) {
                    let distMetros = distKm * 1000;
                    distanciaParaPendiente += distMetros;

                    if (distanciaParaPendiente >= 15) {
                        let diferenciaAltitud = altitudActual - ultimaAltitud;
                        let pendiente = (diferenciaAltitud / distanciaParaPendiente) * 100;
                        
                        actualizarSemaforo(pendiente);

                        distanciaParaPendiente = 0;
                        ultimaAltitud = altitudActual;
                    }
                } else if (altitudActual !== null && ultimaAltitud === null) {
                    ultimaAltitud = altitudActual; 
                }
            }
            ultimaPosicion = posicion;

            // 3. MAPA
            if (!mapa) {
                document.getElementById('mapa').style.display = 'block';
                mapa = L.map('mapa').setView([lat, lon], 17);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapa);
                marcador = L.marker([lat, lon]).addTo(mapa);
                trazadoRuta = L.polyline([], {color: '#00CC96', weight: 5}).addTo(mapa);
            } else {
                marcador.setLatLng([lat, lon]);
                mapa.panTo([lat, lon]);
            }
            trazadoRuta.addLatLng([lat, lon]);
        }

        // CONTROL DE COLORES Y AVISOS DE VOZ
        function actualizarSemaforo(pendiente) {
            document.getElementById('ui-pendiente').innerText = pendiente.toFixed(1);
            let uiEstado = document.getElementById('ui-estado');
            let colorPendiente = document.getElementById('ui-pendiente');

            if (pendiente <= 2) {
                uiEstado.innerText = "🟢 ZONA VERDE: Llano o Bajada";
                uiEstado.style.backgroundColor = "#00CC96";
                uiEstado.style.color = "#000";
                colorPendiente.style.color = "#00CC96";
                
                if (zonaActual !== "VERDE") {
                    hablar("Zona verde. Terreno favorable. Ritmo constante.");
                    zonaActual = "VERDE";
                }

            } else if (pendiente <= 8) {
                uiEstado.innerText = "🟡 ZONA AMARILLA: Trepada Constante";
                uiEstado.style.backgroundColor = "#FECB52";
                uiEstado.style.color = "#000";
                colorPendiente.style.color = "#FECB52";

                if (zonaActual !== "AMARILLA") {
                    hablar("Atención, zona amarilla. Inclinación media. Regulá el aire.");
                    zonaActual = "AMARILLA";
                }

            } else {
                uiEstado.innerText = "🔴 ZONA ROJA: ¡Pared Dura!";
                uiEstado.style.backgroundColor = "#EF553B";
                uiEstado.style.color = "#FFF";
                colorPendiente.style.color = "#EF553B";

                if (zonaActual !== "ROJA") {
                    hablar("Peligro. Pared por delante en zona roja. Meté piñón grande y regulá la respiración.");
                    zonaActual = "ROJA";
                }
            }
        }

        function errorGPS(err) {
            document.getElementById('ui-estado').innerText = "❌ ERROR DE SEÑAL GPS";
            document.getElementById('ui-estado').style.backgroundColor = "#EF553B";
            document.getElementById('ui-estado').style.color = "#FFF";
        }

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; 
        }
    </script>
</body>
</html>
